<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="发动机英语">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCBmaWxsPSIjNjM2NkYxIiB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcngPSIyMCIvPjx0ZXh0IHg9IjUwIiB5PSI2NSIgZm9udC1zaXplPSI1MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiPu+4mTwvdGV4dD48L3N2Zz4=">
    <title>发动机英语速记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 50%, #fce7f3 100%);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-overflow-scrolling: touch;
        }
        .nav {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 12px 16px;
        }
        .nav-title {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .nav-stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #4b5563;
        }
        .tabs {
            display: flex;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: #f3f4f6;
            color: #374151;
        }
        .tab-btn.active {
            background: #6366f1;
            color: white;
        }
        .page {
            padding: 24px 16px;
        }
        .hidden {
            display: none !important;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card-flip {
            perspective: 1000px;
            -webkit-perspective: 1000px;
            height: 140px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }
        .card-flipped .card-inner {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card-front {
            color: white;
        }
        .card-back {
            background: white;
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }
        .word-en {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 4px;
        }
        .word-cn {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 4px;
        }
        .small-text {
            font-size: 12px;
            opacity: 0.8;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .btn:active {
            box-shadow: none;
            transform: translateY(4px);
        }
        .btn-primary {
            background: #6366f1;
            color: white;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-gray {
            background: #f3f4f6;
            color: #374151;
        }
        .btn-small {
            padding: 8px 12px;
            font-size: 14px;
            width: auto;
        }
        .btn:disabled {
            background: #d1d5db;
            color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s;
        }
        .hearts {
            display: flex;
            gap: 4px;
        }
        .heart {
            color: #ef4444;
            font-size: 16px;
        }
        .heart-empty {
            color: #d1d5db;
        }
        .option-btn {
            width: 100%;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .option-btn:hover {
            border-color: #6366f1;
        }
        .option-btn.correct {
            border-color: #10b981;
            background: rgba(16,185,129,0.1);
        }
        .option-btn.wrong {
            border-color: #ef4444;
            background: rgba(239,68,68,0.1);
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-5px); }
            40%,80% { transform: translateX(5px); }
        }
        .feedback {
            padding: 16px;
            border-radius: 12px;
            margin: 16px 0;
            display: flex;
            align-items: center;
        }
        .feedback-success {
            background: rgba(16,185,129,0.1);
        }
        .feedback-error {
            background: rgba(239,68,68,0.1);
        }
        .filter-btns {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }
        .filter-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: #f3f4f6;
            color: #374151;
        }
        .filter-btn.active {
            background: #6366f1;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* 单词管理相关样式 */
        .manage-btn {
            margin-left: auto;
            padding: 4px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: #6366f1;
            color: white;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
        }
        .close-btn {
            border: none;
            background: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
        }
        .word-list {
            margin-bottom: 20px;
            border-top: 1px solid #e5e7eb;
        }
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .word-info {
            flex: 1;
        }
        .word-item-en {
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 2px;
        }
        .word-item-cn {
            font-size: 14px;
            color: #6b7280;
        }
        .word-actions {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .edit-btn {
            background: #dbeafe;
            color: #1e40af;
        }
        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
        }
        .color-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
        }
        .color-option.selected {
            border-color: #1f2937;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #6b7280;
        }
        .sync-btn {
            margin-left: 8px;
            padding: 4px 8px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            background: #10b981;
            color: white;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="nav">
        <div class="nav-title">
            ⚙️ 发动机英语
            <div class="nav-stats">
                <span>掌握 <span id="total-mastered">0</span>/<span id="total-words">39</span></span>
                <span>错题 <span id="total-wrong">0</span></span>
                <button id="sync-btn" class="sync-btn">🔄 同步</button>
            </div>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="home">📚 学习</button>
            <button class="tab-btn" data-tab="wordbook">📖 单词本</button>
            <button class="tab-btn" data-tab="wrongbook">❌ 错题</button>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loading-page" class="loading">
        <p>🔄 正在同步云端单词库...</p>
    </div>

    <!-- 首页 -->
    <div id="home-page" class="page hidden">
        <div style="max-width: 400px; margin: 0 auto;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px;">
                <button id="start-btn" class="btn btn-primary">
                    🚀 开始学习<br><span style="font-size: 12px; opacity: 0.8;">10题一关</span>
                </button>
                <button id="review-btn" class="btn btn-danger">
                    🔄 复习错题<br><span style="font-size: 12px; opacity: 0.8;">针对性突破</span>
                </button>
            </div>
            <div style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <h3 style="font-size: 16px; font-weight: bold; margin-bottom: 12px;">学习进度</h3>
                <div class="progress-bar">
                    <div id="home-progress" class="progress-fill" style="width: 0%;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6b7280;">
                    <span>0%</span>
                    <span>100%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 单词本 -->
    <div id="wordbook-page" class="page hidden">
        <div class="filter-btns">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="mastered">已掌握</button>
            <button class="filter-btn" data-filter="unmastered">未掌握</button>
            <button id="manage-words-btn" class="manage-btn">管理单词</button>
        </div>
        <div id="wordbook-grid" class="card-grid"></div>
    </div>

    <!-- 错题本 -->
    <div id="wrongbook-page" class="page hidden">
        <button id="test-wrong-btn" class="btn btn-danger" style="margin-bottom: 24px;">
            📝 测试所有错题
        </button>
        <div id="wrongbook-empty" class="empty-state">
            <div style="font-size: 64px; margin-bottom: 16px;">✅</div>
            <h3 style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">太棒了！</h3>
            <p style="color: #6b7280;">你还没有错题</p>
        </div>
        <div id="wrongbook-grid" class="card-grid hidden"></div>
    </div>

    <!-- 学习界面 -->
    <div id="lesson-page" class="page hidden">
        <div style="background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); padding: 12px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <button id="exit-btn" style="border: none; background: none; font-size: 18px; cursor: pointer;">✖️</button>
                <div style="flex: 1; margin: 0 16px;">
                    <div class="progress-bar" style="margin: 0;">
                        <div id="lesson-progress" class="progress-fill" style="width: 0%;"></div>
                    </div>
                </div>
                <div id="lesson-hearts" class="hearts">
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                </div>
            </div>
        </div>

        <div style="max-width: 400px; margin: 0 auto;">
            <div style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 24px;">
                <p style="font-size: 14px; color: #6b7280; margin-bottom: 8px;">选择正确的翻译</p>
                <h2 id="question-text" style="font-size: 32px; font-weight: bold; margin-bottom: 16px;">cooling system</h2>
                <button id="speak-btn" style="border: none; background: none; color: #6366f1; font-size: 16px; cursor: pointer;">
                    🔊 听发音
                </button>
            </div>

            <div id="options-container"></div>

            <div id="feedback" class="feedback hidden">
                <span id="feedback-icon" style="font-size: 24px; margin-right: 12px;">✅</span>
                <span id="feedback-text" style="font-size: 18px; font-weight: bold;">正确</span>
            </div>

            <button id="continue-btn" class="btn btn-gray" disabled>
                按空格键继续
            </button>
        </div>
    </div>

    <!-- 完成界面 -->
    <div id="complete-page" class="page hidden">
        <div style="max-width: 350px; margin: 0 auto; text-align: center;">
            <div style="background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 24px;">
                <div style="font-size: 80px; margin-bottom: 16px;">🏆</div>
                <h2 style="font-size: 24px; font-weight: bold; margin-bottom: 24px;">关卡完成！</h2>
                <div style="font-size: 16px; color: #4b5563; margin-bottom: 8px;">
                    正确率：<span id="accuracy" style="font-weight: bold; color: #6366f1;">100%</span>
                </div>
                <div style="font-size: 16px; color: #4b5563; margin-bottom: 8px;">
                    用时：<span id="time-spent" style="font-weight: bold;">5分20秒</span>
                </div>
                <div style="font-size: 16px; color: #4b5563;">
                    连续答对：<span id="max-streak" style="font-weight: bold; color: #8b5cf6;">10题</span>
                </div>
            </div>
            <button id="next-btn" class="btn btn-primary" style="margin-bottom: 12px;">继续学习</button>
            <button id="home-btn" class="btn btn-gray">返回首页</button>
        </div>
    </div>

    <!-- 失败界面 -->
    <div id="gameover-page" class="page hidden">
        <div style="max-width: 350px; margin: 0 auto; text-align: center;">
            <div style="background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 24px;">
                <div style="font-size: 80px; margin-bottom: 16px;">💔</div>
                <h2 style="font-size: 24px; font-weight: bold; margin-bottom: 16px;">生命值用完了</h2>
                <p style="color: #6b7280;">别灰心，再试一次吧！</p>
            </div>
            <button id="retry-btn" class="btn btn-primary" style="margin-bottom: 12px;">重新开始</button>
            <button id="gameover-home-btn" class="btn btn-gray">返回首页</button>
        </div>
    </div>

    <!-- 单词管理模态框 -->
    <div id="manage-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">管理单词</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            
            <!-- 添加新单词表单 -->
            <div style="margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #e5e7eb;">
                <h4 style="font-size: 16px; font-weight: bold; margin-bottom: 12px;">添加新单词</h4>
                <div class="form-group">
                    <label class="form-label">英文单词</label>
                    <input type="text" id="new-word-en" class="form-input" placeholder="例如：engine">
                </div>
                <div class="form-group">
                    <label class="form-label">中文译文</label>
                    <input type="text" id="new-word-cn" class="form-input" placeholder="例如：发动机">
                </div>
                <div class="form-group">
                    <label class="form-label">卡片颜色</label>
                    <div class="color-picker" id="color-picker">
                        <div class="color-option selected" style="background: #3b82f6;" data-color="#3b82f6"></div>
                        <div class="color-option" style="background: #22c55e;" data-color="#22c55e"></div>
                        <div class="color-option" style="background: #6b7280;" data-color="#6b7280"></div>
                        <div class="color-option" style="background: #a855f7;" data-color="#a855f7"></div>
                        <div class="color-option" style="background: #eab308;" data-color="#eab308"></div>
                        <div class="color-option" style="background: #f97316;" data-color="#f97316"></div>
                        <div class="color-option" style="background: #ef4444;" data-color="#ef4444"></div>
                        <div class="color-option" style="background: #14b8a6;" data-color="#14b8a6"></div>
                        <div class="color-option" style="background: #ec4899;" data-color="#ec4899"></div>
                        <div class="color-option" style="background: #06b6d4;" data-color="#06b6d4"></div>
                    </div>
                </div>
                <button id="add-word-btn" class="btn btn-primary btn-small">添加单词</button>
            </div>
            
            <!-- 现有单词列表 -->
            <h4 style="font-size: 16px; font-weight: bold; margin-bottom: 12px;">现有单词</h4>
            <div id="word-list" class="word-list"></div>
        </div>
    </div>

    <!-- 编辑单词模态框 -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">编辑单词</h3>
                <button class="close-btn" id="close-edit-modal">&times;</button>
            </div>
            
            <div class="form-group">
                <label class="form-label">英文单词</label>
                <input type="text" id="edit-word-en" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">中文译文</label>
                <input type="text" id="edit-word-cn" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">卡片颜色</label>
                <div class="color-picker" id="edit-color-picker">
                    <div class="color-option" style="background: #3b82f6;" data-color="#3b82f6"></div>
                    <div class="color-option" style="background: #22c55e;" data-color="#22c55e"></div>
                    <div class="color-option" style="background: #6b7280;" data-color="#6b7280"></div>
                    <div class="color-option" style="background: #a855f7;" data-color="#a855f7"></div>
                    <div class="color-option" style="background: #eab308;" data-color="#eab308"></div>
                    <div class="color-option" style="background: #f97316;" data-color="#f97316"></div>
                    <div class="color-option" style="background: #ef4444;" data-color="#ef4444"></div>
                    <div class="color-option" style="background: #14b8a6;" data-color="#14b8a6"></div>
                    <div class="color-option" style="background: #ec4899;" data-color="#ec4899"></div>
                    <div class="color-option" style="background: #06b6d4;" data-color="#06b6d4"></div>
                </div>
            </div>
            <button id="save-edit-btn" class="btn btn-primary">保存修改</button>
        </div>
    </div>

    <script>
        // ==================== 云端同步配置 ====================
        // 替换成你的GitHub用户名和仓库名

        // ==================== 云端同步函数 ====================
        // 从云端加载单词
        async function loadWordsFromCloud() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/words.json`);
                
                if (response.status === 404) {
                    // 如果文件不存在，创建初始文件
                    await saveWordsToCloud(defaultWords);
                    return [...defaultWords];
                }
                
                const data = await response.json();
                const content = atob(data.content);
                return JSON.parse(content);
            } catch (error) {
                console.error('加载云端单词失败，使用本地默认:', error);
                return [...defaultWords];
            }
        }

        // 保存单词到云端
        async function saveWordsToCloud(words) {
            try {
                // 先获取文件的sha（如果存在）
                let sha = null;
                try {
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/words.json`);
                    const data = await response.json();
                    sha = data.sha;
                } catch (e) {
                    // 文件不存在，sha为null
                }

                const content = btoa(JSON.stringify(words, null, 2));
                
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/words.json`, {
                    method: 'PUT',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '更新单词库',
                        content: content,
                        sha: sha,
                        branch: GITHUB_BRANCH
                    })
                });

                return response.ok;
            } catch (error) {
                console.error('保存到云端失败:', error);
                return false;
            }
        }

            if (oldEn !== en) {

        // 渲染单词本
        function renderWordbook(filter = 'all') {
            const grid = document.getElementById('wordbook-grid');
            grid.innerHTML = '';

                });

                    if (e.target.classList.contains('toggle-btn')) return;
                    card.classList.remove('card-flipped');
                });

                card.querySelector('.toggle-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (masteredWords.includes(word.en)) {
                        masteredWords = masteredWords.filter(w => w !== word.en);
                    } else {
                        masteredWords.push(word.en);
                    }
                    localStorage.setItem('masteredWords', JSON.stringify(masteredWords));
                    updateStats();
                    renderWordbook(filter);
                });

                grid.appendChild(card);
            });
        }

        // 开始学习
        function startLesson(review = false) {
            isReview = review;
            let words = review && wrongWords.length > 0 
                ? [...wrongWords]
                : allWords.filter(w => !masteredWords.includes(w.en)).length > 0
                    ? allWords.filter(w => !masteredWords.includes(w.en))
                    : [...allWords];

            currentQuestions = [];
            const shuffled = [...words].sort(() => 0.5 - Math.random());
            for (let i = 0; i < Math.min(10, shuffled.length); i++) {
                const w = shuffled[i];
                const wrong = allWords.filter(x => x.cn !== w.cn).sort(() => 0.5 - Math.random()).slice(0, 3).map(x => x.cn);
                const options = [w.cn, ...wrong].sort(() => 0.5 - Math.random());
                currentQuestions.push({ word: w, options, correct: w.cn });
            }

            currentIndex = 0;
            hearts = 5;
            streak = 0;
            maxStreak = 0;
            correctCount = 0;
            startTime = Date.now();

            showPage('lesson');
            updateHearts();
            showQuestion();
        }

        // 显示题目
        function showQuestion() {
            const q = currentQuestions[currentIndex];
            currentWord = q.word;
            document.getElementById('lesson-progress').style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
            document.getElementById('question-text').textContent = q.word.en;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.dataset.cn = opt;
                btn.addEventListener('click', () => checkAnswer(opt, q.correct));
                container.appendChild(btn);
            });

            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('continue-btn').disabled = true;
            document.getElementById('continue-btn').classList.remove('btn-primary');
            document.getElementById('continue-btn').classList.add('btn-gray');
        }

        // 检查答案
        function checkAnswer(selected, correct) {
            const feedback = document.getElementById('feedback');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');
            const continueBtn = document.getElementById('continue-btn');
            const questionText = document.getElementById('question-text');

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.cn === correct) btn.classList.add('correct');
                else if (btn.dataset.cn === selected && selected !== correct) btn.classList.add('wrong');
            });

            // 反转显示
            questionText.textContent = currentWord.cn;
            document.querySelectorAll('.option-btn').forEach(btn => {
                const cn = btn.dataset.cn;
                const en = allWords.find(w => w.cn === cn)?.en || '';
                btn.innerHTML = `${cn}<br><span style="font-size: 12px; color: #6b7280;">${en}</span>`;
            });

            feedback.classList.remove('hidden');

            if (selected === correct) {
                streak++;
                maxStreak = Math.max(maxStreak, streak);
                correctCount++;

                feedback.classList.add('feedback-success');
                feedback.classList.remove('feedback-error');
                icon.textContent = '✅';
                text.textContent = '正确';
                text.style.color = '#10b981';

                if (streak % 5 === 0 && hearts < 5) {
                    hearts++;
                    updateHearts();
                    text.textContent = '正确 +1❤️';
                }

                if (isReview) {
                    wrongWords = wrongWords.filter(w => w.en !== currentWord.en);
                    localStorage.setItem('wrongWords', JSON.stringify(wrongWords));
                    updateStats();
                }
            } else {
                streak = 0;
                hearts--;
                updateHearts();

                if (!wrongWords.some(w => w.en === currentWord.en)) {
                    wrongWords.push(currentWord);
                    localStorage.setItem('wrongWords', JSON.stringify(wrongWords));
                    updateStats();
                }

                feedback.classList.add('feedback-error');
                feedback.classList.remove('feedback-success');
                icon.textContent = '❌';
                text.textContent = '错误';
                text.style.color = '#ef4444';

                if (hearts <= 0) {
                    setTimeout(() => showPage('gameover'), 1500);
                    return;
                }
            }

            continueBtn.disabled = false;
            continueBtn.classList.remove('btn-gray');
            continueBtn.classList.add('btn-primary');
        }

        // 下一题
        function nextQuestion() {
